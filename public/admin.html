<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | MKX ESPORTS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;

            /* CYBERSECURITY BACKGROUND */
            background:
                linear-gradient(
                    rgba(2, 7, 15, 0.72),
                    rgba(2, 7, 15, 0.86)
                ),
                url("cybersecurity-bg.png.jpeg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(255, 193, 7, 0.07),
                    transparent 35%
                );

            pointer-events: none;
            z-index: 0;
        }

        /* ================= HEADER ================= */

        header {
            position: relative;
            z-index: 5;

            width: 100%;
            padding: 22px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(3, 8, 18, 0.78);
            border-bottom: 1px solid rgba(255, 193, 7, 0.22);

            backdrop-filter: blur(12px);
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;

            text-shadow:
                0 0 15px rgba(255, 193, 7, 0.25);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;

            font-size: 14px;
            font-weight: 700;

            transition: 0.25s ease;
        }

        nav a:hover {
            color: #ffc107;
        }

        /* ================= MAIN ================= */

        .admin-page {
            position: relative;
            z-index: 2;

            min-height: calc(100vh - 155px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 70px 20px;
        }

        /* ================= LOGIN BOX ================= */

        .admin-login-box {
            width: 100%;
            max-width: 520px;

            padding: 45px 42px;

            position: relative;

            background: rgba(5, 12, 24, 0.84);

            border: 1px solid rgba(255, 193, 7, 0.35);
            border-radius: 22px;

            backdrop-filter: blur(18px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.65),
                0 0 35px rgba(255, 193, 7, 0.08);

            overflow: hidden;
        }

        .admin-login-box::before {
            content: "";

            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background: linear-gradient(
                90deg,
                transparent,
                #ffc107,
                #fff3b0,
                #ffc107,
                transparent
            );

            box-shadow:
                0 0 18px rgba(255, 193, 7, 0.7);
        }

        /* ================= ICON ================= */

        .admin-icon {
            width: 78px;
            height: 78px;

            margin: 0 auto 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 32px;

            background: rgba(255, 193, 7, 0.08);

            border: 1px solid rgba(255, 193, 7, 0.45);

            box-shadow:
                0 0 25px rgba(255, 193, 7, 0.12),
                inset 0 0 20px rgba(255, 193, 7, 0.05);
        }

        .admin-tag {
            display: block;

            text-align: center;

            color: #ffc107;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 3px;

            margin-bottom: 12px;
        }

        .admin-title {
            text-align: center;

            font-size: 38px;
            font-weight: 900;

            margin-bottom: 10px;
        }

        .admin-subtitle {
            text-align: center;

            color: #aeb8c8;

            font-size: 14px;

            margin-bottom: 35px;
        }

        /* ================= FORM ================= */

        .admin-form-group {
            margin-bottom: 23px;
        }

        .admin-form-group > label:first-child {
            display: block;

            margin-bottom: 9px;

            color: #ffffff;

            font-size: 14px;
            font-weight: 700;
        }

        .admin-input {
            width: 100%;
            height: 61px;

            padding: 0 18px;

            color: #ffffff;

            background: rgba(0, 0, 0, 0.42);

            border: 1px solid #344158;
            border-radius: 12px;

            outline: none;

            font-size: 16px;

            transition: 0.25s ease;
        }

        .admin-input::placeholder {
            color: #69758a;
        }

        .admin-input:focus {
            border-color: #ffc107;

            box-shadow:
                0 0 0 3px rgba(255, 193, 7, 0.08),
                0 0 20px rgba(255, 193, 7, 0.08);

            background: rgba(0, 0, 0, 0.55);
        }

        /* ================= SHOW PASSWORD ================= */

        .show-password {
            display: flex;
            align-items: center;

            gap: 9px;

            margin-top: 12px;

            color: #aeb8c8;

            font-size: 13px;

            cursor: pointer;
        }

        .show-password input {
            width: 16px;
            height: 16px;

            accent-color: #ffc107;

            cursor: pointer;
        }

        .show-password:hover {
            color: #ffffff;
        }

        /* ================= LOGIN BUTTON ================= */

        .admin-login-btn {
            width: 100%;
            height: 61px;

            margin-top: 8px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #ffc107,
                #e0a800
            );

            color: #090d15;

            font-size: 15px;
            font-weight: 900;

            letter-spacing: 0.3px;

            cursor: pointer;

            transition: 0.25s ease;

            box-shadow:
                0 10px 25px rgba(255, 193, 7, 0.18);
        }

        .admin-login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 32px rgba(255, 193, 7, 0.28);

            background: linear-gradient(
                135deg,
                #ffd54f,
                #ffc107
            );
        }

        .admin-login-btn:active {
            transform: translateY(0);
        }

        /* ================= SECURITY ================= */

        .admin-security {
            margin-top: 22px;

            text-align: center;

            color: #7f8da3;

            font-size: 12px;

            letter-spacing: 0.5px;
        }

        .admin-security span {
            color: #3ddc84;

            margin-right: 5px;

            text-shadow:
                0 0 8px rgba(61, 220, 132, 0.7);
        }

        /* ================= FOOTER ================= */

        footer {
            position: relative;
            z-index: 5;

            text-align: center;

            padding: 22px 20px;

            background: rgba(2, 7, 15, 0.82);

            border-top: 1px solid rgba(255, 193, 7, 0.18);

            backdrop-filter: blur(10px);
        }

        footer .logo {
            font-size: 18px;
        }

        footer p {
            margin-top: 7px;

            color: #aeb8c8;

            font-size: 12px;

            letter-spacing: 1.5px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            header {
                padding: 18px 20px;

                flex-direction: column;

                gap: 16px;
            }

            .logo {
                font-size: 21px;
            }

            nav {
                gap: 14px;

                flex-wrap: wrap;
                justify-content: center;
            }

            nav a {
                font-size: 12px;
            }

            .admin-page {
                min-height: calc(100vh - 170px);

                padding: 45px 15px;
            }

            .admin-login-box {
                padding: 35px 23px;

                border-radius: 18px;
            }

            .admin-title {
                font-size: 30px;
            }

            .admin-icon {
                width: 68px;
                height: 68px;

                font-size: 28px;
            }

            .admin-input,
            .admin-login-btn {
                height: 57px;
            }
        }

        @media (max-width: 420px) {

            nav {
                gap: 10px;
            }

            nav a {
                font-size: 11px;
            }

            .admin-login-box {
                padding: 32px 18px;
            }

            .admin-title {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">
            ⚡ MKX ESPORTS
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="tournament.html">Tournaments</a>
            <a href="register.html">Register</a>
            <a href="track.html">Track Status</a>
        </nav>

    </header>


    <!-- ================= ADMIN LOGIN ================= -->

    <main class="admin-page">

        <div class="admin-login-box">

            <div class="admin-icon">
                🔐
            </div>

            <span class="admin-tag">
                MKX ESPORTS ADMIN
            </span>

            <h1 class="admin-title">
                Admin Login
            </h1>

            <p class="admin-subtitle">
                Authorized administrators only.
            </p>


            <!-- USERNAME -->

            <div class="admin-form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    class="admin-input"
                    placeholder="Enter admin username"
                    autocomplete="username"
                >

            </div>


            <!-- PASSWORD -->

            <div class="admin-form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    class="admin-input"
                    placeholder="Enter admin password"
                    autocomplete="current-password"
                >

                <label class="show-password">

                    <input
                        type="checkbox"
                        id="showPassword"
                        onchange="togglePassword()"
                    >

                    <span>
                        Show Password
                    </span>

                </label>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="button"
                class="admin-login-btn"
                onclick="adminLogin()"
            >
                🔐 Login to Admin Panel →
            </button>


            <!-- SECURITY -->

            <div class="admin-security">
                <span>●</span>
                Secure Admin Access
            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="logo">
            ⚡ MKX ESPORTS
        </div>

        <p>
            PLAY TO LEAVE A LEGACY.
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const checkbox =
                document.getElementById("showPassword");

            if (checkbox.checked) {

                password.type = "text";

            } else {

                password.type = "password";

            }
        }


        async function adminLogin() {

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;


            if (!username || !password) {

                alert("Please enter username and password.");

                return;
            }


            try {

                const response = await fetch(
                    "/admin/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            username: username,
                            password: password
                        })
                    }
                );


                const data = await response.json();


                if (data.success) {

                    window.location.href =
                        "admin-dashboard.html";

                } else {

                    alert("Invalid admin credentials.");

                }

            } catch (error) {

                console.error(error);

                alert(
                    "Server error. Please make sure the server is running."
                );

            }

        }

    </script>

</body>
</html>
